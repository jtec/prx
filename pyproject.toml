[project]
name = "prx"
version = "0.0.1"
description = "Making raw GNSS data more accessible."
readme = "README.md"
authors = [
    { name = "Jan Bolting", email = "janbolting@gmail.com" },
    { name = "Paul Thevenon", email = "paul.thevenon@gmail.com" },
]
license = { text = "MIT" }
requires-python = "<3.14,>=3.10"
dependencies = [
    "pandas<3.0.0,>=2.2.3",
    "numpy<3.0,>=2.2",
    "joblib<2.0.0,>=1.4.2",
    "imohash<2.0.0,>=1.1.0",
    "gitpython<4.0.0,>=3.1.41",
    "scipy<2.0.0,>=1.14.1",
    "astropy<7.0.0,>=6.1.7",
    "astropy-iers-data>=0.2026.3",
    "georinex",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "hatanaka>=2.8.1",
    "xarray>=2025.4.0",
]

[project.scripts]
prx = "prx:main"

[tool.pytest]
log_cli_level = "INFO"
log_cli = true

[tool.uv]
package = true
python-preference = "only-managed"

[tool.uv.sources]
georinex = { git = "https://github.com/geospace-code/georinex", rev = "95ef1d8e7150f998a1b5a429090cadb429128648" }

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib<4.0.0,>=3.10.0",
    "plotly>=5.24.1,<7.0.0",
    "line-profiler>=5.0.2",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.4",
    "snakeviz>=2.2.2",
    "viztracer>=1.1.1",
    "pytest-profiling>=1.8.1",
    "memray>=1.19.3;platform_system != 'Windows'",
]

[tool.hatch.build.targets.sdist]
packages = ["src/prx"]
include = [
    "src/prx",
]
exclude = [
    "src/prx/test",
    "src/prx/sp3/test",
    "src/prx/rinex_nav/test",
    "src/prx/rinex_obs/test",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prx"]
include = [
    "src/prx",
]
exclude = [
    "src/prx/test",
    "src/prx/sp3/test",
    "src/prx/rinex_nav/test",
    "src/prx/rinex_obs/test",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"
