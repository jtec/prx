[project]
name = "prx"
version = "0.0.1"
description = "Making raw GNSS data more accessible."
readme = "README.md"
authors = [
    { name = "Jan Bolting", email = "janbolting@gmail.com" },
    { name = "Paul Thevenon", email = "paul.thevenon@gmail.com" },
]
license = { text = "MIT" }
requires-python = "<3.14,>=3.11"
dependencies = [
    "pandas>=3.0.6,<4.0.0",
    "numpy>=2.4.6,<3.0",
    "joblib>=1.6.0,<2.0.0",
    "imohash<2.0.0,>=1.1.0",
    "gitpython>=3.2.1,<4.0.0",
    "scipy>=1.17.1,<2.0.0",
    "astropy>=8.0.2,<9.0.0",
    "astropy-iers-data>=0.2026.10.19.0.52.1",
    "georinex",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "hatanaka>=2.8.1",
    "xarray>=2026.9.0",
]

[project.scripts]
prx = "prx:main"

[tool.pytest]
log_cli_level = "INFO"
log_cli = true

[tool.uv]
package = true
python-preference = "only-managed"

[tool.uv.sources]
georinex = { git = "https://github.com/geospace-code/georinex", rev = "95ef1d8e7150f998a1b5a429090cadb429128648" }

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2,<4.0.0",
    "plotly>=7.1.0,<8.0.0",
    "line-profiler>=5.1.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "snakeviz>=2.2.2",
    "viztracer>=1.1.1",
    "pytest-profiling>=1.8.1",
    "memray>=1.20.0;platform_system != 'Windows'",
]

[tool.hatch.build.targets.sdist]
packages = ["src/prx"]
include = [
    "src/prx",
]
exclude = [
    "src/prx/test",
    "src/prx/sp3/test",
    "src/prx/rinex_nav/test",
    "src/prx/rinex_obs/test",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prx"]
include = [
    "src/prx",
]
exclude = [
    "src/prx/test",
    "src/prx/sp3/test",
    "src/prx/rinex_nav/test",
    "src/prx/rinex_obs/test",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"
